<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>האש שלי · רילים</title>
<style>
:root { --field: #050a3c; --lime: #d4ff3a; }
html, body { margin: 0; background: var(--field) url("field.jpg") center / cover fixed no-repeat; min-height: 100%; }
/* three reels, nothing around them: on a phone one under the other, each the height of the screen;
   wider, side by side */
main { display: grid; gap: 6vh; justify-items: center; padding: 6vh 16px 10vh; }
video { display: block; width: min(100%, calc(86svh * 9 / 16), 788px); height: auto; aspect-ratio: 9 / 16; object-fit: cover; border-radius: 22px; background: #050a3c;
  box-shadow: 0 30px 60px -20px rgba(4, 8, 60, .7); }
@media (min-width: 900px) {
  main { grid-template-columns: repeat(3, auto); justify-content: center; align-items: center; min-height: 100svh; box-sizing: border-box; gap: 3vw; }
  video { width: min(28vw, calc(82svh * 9 / 16)); }
}
</style>
</head>
<body>
<main>
  <video src="sicha.mp4" poster="sicha.jpg" controls playsinline preload="metadata" aria-label="שיחה נפלאה — רבי ישראל דב אודסר"></video>
  <video src="saba.mp4" poster="saba.jpg" controls playsinline preload="metadata" aria-label="הסבא — כולנו חברים"></video>
  <video src="yemini.mp4" poster="yemini.jpg" controls playsinline preload="metadata" aria-label="הפצה — מאיר ימיני ז״ל"></video>
</main>
<script>
// one voice at a time: starting a reel pauses the others
document.querySelectorAll('video').forEach(v => v.addEventListener('play', () =>
  document.querySelectorAll('video').forEach(o => { if (o !== v) o.pause(); })));
</script>
</body>
</html>
